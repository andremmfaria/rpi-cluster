---
k3s_version: "v1.35.3+k3s1"
k3s_token: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET"

k3s_cluster_init: false
k3s_first_server: "{{ groups['k3s_servers'][0] }}"

k3s_data_dir: /mnt/nvme/k3s

cluster_cidr: 10.42.0.0/16
service_cidr: 10.43.0.0/16

k3s_api_vip: ""
k3s_server_url: "https://{{ hostvars[k3s_first_server].node_ip }}:6443"

k3s_server_extra_args:
  - "--disable=traefik"
  - "--disable=servicelb"
  - "--disable=local-storage"
  - "--write-kubeconfig-mode=644"
  - "--cluster-cidr={{ cluster_cidr }}"
  - "--service-cidr={{ service_cidr }}"
  - "--node-ip={{ node_ip }}"
  - "--advertise-address={{ node_ip }}"
  - "--data-dir={{ k3s_data_dir }}"
