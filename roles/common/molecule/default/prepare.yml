---
- name: Prepare controller — generate test SSH key
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Generate molecule test key
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -f /tmp/molecule_test_key -N ""
        creates: /tmp/molecule_test_key

- name: Prepare instances — mock Pi-specific paths
  hosts: all
  gather_facts: false
  tasks:
    - name: Create /boot/firmware directory
      ansible.builtin.file:
        path: /boot/firmware
        state: directory
        mode: "0755"

    - name: Create mock cmdline.txt
      ansible.builtin.copy:
        dest: /boot/firmware/cmdline.txt
        content: "console=serial0,115200 console=tty1 root=PARTUUID=deadbeef rootfstype=ext4 fsck.repair=yes rootwait\n"
        mode: "0644"

    - name: Create mock config.txt
      ansible.builtin.copy:
        dest: /boot/firmware/config.txt
        content: "[all]\n"
        mode: "0644"
