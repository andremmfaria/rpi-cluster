---
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "docker"
    directory: "/roles/common/molecule/default"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "molecule"
    commit-message:
      prefix: "deps(molecule)"
