---
name: "Cluster Setup — Lint"

on:
  push:
    branches:
      - main
      - master
    paths:
      - "cluster-setup/**"
      - ".github/workflows/cluster-setup-lint.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "cluster-setup/**"
      - ".github/workflows/cluster-setup-lint.yml"

jobs:
  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install yamllint
        run: pip install yamllint==1.38.0

      - name: Run yamllint
        run: yamllint .
        working-directory: cluster-setup

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: cluster-setup

      - name: Install Galaxy collections
        run: ansible-galaxy collection install -r requirements.yml
        working-directory: cluster-setup

      - name: Run ansible-lint
        run: ansible-lint
        working-directory: cluster-setup

  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cluster-setup/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: cluster-setup

      - name: Install Galaxy collections
        run: ansible-galaxy collection install -r requirements.yml
        working-directory: cluster-setup

      - name: Check site.yml
        run: >
          ansible-playbook --syntax-check
          -i inventories/homelab/hosts.yml
          site.yml
        working-directory: cluster-setup

      - name: Check 00-ping.yml
        run: >
          ansible-playbook --syntax-check
          -i inventories/homelab/hosts.yml
          playbooks/00-ping.yml
        working-directory: cluster-setup

      - name: Check 99-reset.yml
        run: >
          ansible-playbook --syntax-check
          -i inventories/homelab/hosts.yml
          playbooks/99-reset.yml
        working-directory: cluster-setup
