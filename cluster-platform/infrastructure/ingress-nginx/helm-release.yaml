---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: ingress-nginx
  namespace: kube-system
spec:
  repo: https://kubernetes.github.io/ingress-nginx
  chart: ingress-nginx
  version: "4.15.1"
  targetNamespace: ingress-nginx
  createNamespace: true
  valuesContent: |
    controller:
      service:
        type: LoadBalancer
        loadBalancerIP: 192.168.50.40
      hostNetwork: false
      publishService:
        enabled: true
